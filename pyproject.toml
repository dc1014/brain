[project]
name = "coretex"
version = "0.1.0-0a0"
description = "CoreTex is the biomimetic control plane for AI - interoperable, safe, token efficient, self-healing, and self-improving."
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "litellm>=1.83.14",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.23.1",
    "pyyaml>=6.0.0",
    "psutil>=7.2.2",
    "pypdf>=6.11.0",
    "pydantic>=2.12.5",
    "aiohttp>=3.13.4",
    "aiosqlite>=0.22.1",
    "filelock>=3.29.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "coretex-sense",
]

[project.optional-dependencies]
syntax = [
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
]

vision = [
    "playwright>=1.59.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=2.4.4"
]

audio = [
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.12",
]

[tool.mypy]
exclude = [
    "^Studio/",
    "^Personal/",
    "^Professional/",
    "^Meta/",
    "^logs/",
    "System/snapshots/",
]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v -n auto --dist=loadfile --strict-markers -m \"not eval\""
pythonpath = [".", "Sense"]
testpaths = ["System/tests"]
norecursedirs = ["Studio", "Personal", "Professional", "Meta", "Media", "node_modules", ".venv"]
markers = [
    "core: core system functionality",
    "eval: AI evaluation tests (makes real LLM API calls, costs money)",
]

[tool.uv.workspace]
members = ["Sense"]

[tool.uv.sources]
coretex-sense = { workspace = true }

[tool.coverage.run]
source = ["System"]
omit = [
    "System/cli.py",
    "System/cli_*.py",
    "System/smoke_test.py",
    "System/tools/engrams/*"
]

[tool.coverage.report]
show_missing = true
# Enforces the strict CLAUDE.md gate rule programmatically
fail_under = 80


[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["System"]
