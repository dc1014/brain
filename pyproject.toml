[project]
name = "brain"
version = "0.1.0"
description = "Brain is the first biomimetic control plane for AI tooling - interoperable, safe, token efficient, self-healing, and self-improving."
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    # ⚡ CORE FOOTPRINT: The absolute minimum required for cognition, routing, and memory.
    "litellm>=1.83.14",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.23.1",
    "pyyaml>=6.0.0",
    "psutil>=7.2.2",
    "pypdf>=6.11.0",
    "pydantic>=2.12.5",
    "aiohttp>=3.13.4",
    "aiosqlite>=0.22.1",
    "filelock>=3.29.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "brain-sense",
]

[project.optional-dependencies]
# 🧠 POLYGLOT SYNTAX: Advanced AST parsing for JS/TS/Python code refactoring
syntax = [
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
]

# 👁️ VISION CORTEX: Multimodal capabilities, layout auditing, and screenshot rendering
vision = [
    "playwright>=1.59.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=2.4.4"
]

# 👂 AUDITORY CORTEX: Physical voice input/output via system microphones and speakers
audio = [
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.12",
]

[tool.mypy]
# SHIFT-LEFT: Prevent the OS from type-checking dynamically generated sandbox code
exclude = [
    "^Studio/",
    "^Personal/",
    "^Professional/",
    "^Meta/",
    "^logs/"
]
# Ignore missing imports for third-party libraries that don't have type hints
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."


[tool.pytest.ini_options]
# ⚡ SHIFT-LEFT: Explicit loop isolation prevents parallel test futures from hanging
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v -n auto --dist=loadfile --strict-markers -m \"not eval\""
pythonpath = [".", "Sense"]
testpaths = ["System/tests"]
norecursedirs = ["Studio", "Personal", "Professional", "Meta", "Media", "node_modules", ".venv"]
markers = [
    "core: core system functionality",
    "eval: AI evaluation tests (makes real LLM API calls, costs money)",
]

[tool.uv.workspace]
members = ["Sense"]

[tool.uv.sources]
brain-sense = { workspace = true }

[tool.coverage.run]
# Tells coverage exactly what module path directory to monitor
source = ["System"]
omit = [
    "System/cli.py",
    "System/cli_*.py",
    "System/smoke_test.py",
    "System/tools/engrams/*"
]

[tool.coverage.report]
# Automatically outputs missing line numbers to your terminal screen
show_missing = true
# Enforces the strict CLAUDE.md gate rule programmatically
fail_under = 80
