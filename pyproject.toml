[project]
name = "brain"
version = "0.1.0"
description = "Brain is the first biomimetic control plane for AI tooling - interoperable, safe, token efficient, self-healing, and self-improving."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.83.14",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.23.1",
    "pyyaml>=6.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "sense",
    "playwright>=1.59.0",
    "psutil>=7.2.2",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "numpy>=2.4.4",
    "pypdf>=6.11.0",
    "pydantic>=2.12.5",
    "opencv-python-headless>=4.9.0.80",
    "aiohttp>=3.13.4",
    "aiosqlite>=0.22.1",
    "filelock>=3.29.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[tool.mypy]
# SHIFT-LEFT: Prevent the OS from type-checking dynamically generated sandbox code
exclude = [
    "^Studio/",
    "^Personal/",
    "^Professional/",
    "^Meta/",
    "^logs/"
]
# Ignore missing imports for third-party libraries that don't have type hints
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."


[tool.pytest.ini_options]
addopts = "-v -m \"not eval\" --strict-markers --cov=System --cov-report=term-missing --cov-fail-under=80"
pythonpath = [".", "Sense"]
testpaths = ["System/tests"]
# SHIFT-LEFT: Prevent Pytest from scanning generated child projects
norecursedirs = ["Studio", "Personal", "Professional", "Meta", "Media", "node_modules", ".venv"]
markers = [
    "core: core system functionality",
    "eval: AI evaluation tests (makes real LLM API calls, costs money)",
]

[tool.uv.workspace]
members = ["Sense"]

[tool.uv.sources]
sense = { workspace = true }
