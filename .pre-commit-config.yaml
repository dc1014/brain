repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^Studio/
      - id: end-of-file-fixer
        exclude: ^Studio/

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        exclude: ^Studio/

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^Studio/

      - id: mypy
        name: mypy
        # Explicitly check only the System folder to stay fast and focused
        entry: uv run mypy System/
        language: system
        pass_filenames: false

      - id: pytest
        name: Run Pytest (Zero Debt)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

  # Markdown Lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--disable", "MD013"] # MD013 is line-length, which is annoying for creative writing/journals

  # Mypy (Static Type Checking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports"]
