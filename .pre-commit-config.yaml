repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: GitLeaks Local Secret Shield
        description: Protects API keys and credentials from entering git history automatically.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^Studio/
      - id: end-of-file-fixer
        exclude: ^Studio/

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        exclude: ^Studio/

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^Studio/

      - id: mypy
        name: mypy
        entry: uv run mypy System/ Sense/ --ignore-missing-imports
        language: system
        types_or: [python, pyi]  # ⚡ OPTIMIZATION: Only run type checks if Python files change
        pass_filenames: false

      - id: pytest
        name: Run Pytest (Zero Debt)
        entry: uv run pytest System/tests Sense/tests -n auto
        language: system
        types_or: [python, pyi]  # ⚡ OPTIMIZATION: Do not run entire test suite on pure markdown changes
        pass_filenames: false
