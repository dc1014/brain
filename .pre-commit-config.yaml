repos:
  # Ruff (Python Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Markdown Lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--disable", "MD013"] # MD013 is line-length, which is annoying for creative writing/journals

  # Mypy (Static Type Checking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports"]

# --- MONOREPO HOOKS: FORGE SUB-PROJECTS ---
  - repo: local
    hooks:
      - id: forge-biome
        name: Forge Biome Linter (Studio/*)
        entry: bash -c 'for d in Studio/*; do if [ -d "$d" ] && [ -f "$d/biome.json" ]; then echo "Linting $d..." && (cd "$d" && npx @biomejs/biome check --write .); fi; done'
        language: system
        pass_filenames: false

      - id: forge-vitest
        name: Forge Vitest Evals (Studio/*)
        entry: bash -c 'for d in Studio/*; do if [ -d "$d" ] && [ -f "$d/package.json" ]; then echo "Testing $d..." && (cd "$d" && npm run test); fi; done'
        language: system
        pass_filenames: false