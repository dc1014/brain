repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2 # Pin a stable, deterministic version
    hooks:
      - id: gitleaks
        name: GitLeaks Local Secret Shield
        description: Protects API keys and credentials from entering git history automatically.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^Studio/
      - id: end-of-file-fixer
        exclude: ^Studio/

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        exclude: ^Studio/

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^Studio/

      - id: mypy
        name: mypy
        entry: uv run mypy System/ Sense/ --ignore-missing-imports
        language: system
        pass_filenames: false

      - id: pytest
        name: Run Pytest (Zero Debt)
        entry: uv run pytest System/tests Sense/tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

  # Markdown Lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--disable", "MD013"] # MD013 is line-length, which is annoying for creative writing/journals
