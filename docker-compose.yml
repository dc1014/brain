version: '3.8'

services:
  coretex:
    build:
      context: .
      dockerfile: Dockerfile
    image: coretex
    container_name: ctx-os
    # 🛡️ SHIFT-LEFT SECURITY: Map host user credentials dynamically to bypass root permission pollution
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount the configuration and memory state securely
      - ./System/config:/opt/coretex/System/config
      - ./Meta:/opt/coretex/Meta
      - ./.env:/opt/coretex/.env
      # ⚡ UNIFIED PERMISSIONS: Mount logs directly to avoid container permission crashes
      - ./logs:/opt/coretex/logs
      # Dynamic mount point for the target workspace resolved via wrapper scripts
      - ${CORETEX_WORKSPACE_MOUNT:-./Workspace}:/workspace
    network_mode: host # Allows CoreTex to talk to localhost:11434 (Ollama) seamlessly
    tty: true
    stdin_open: true
