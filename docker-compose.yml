version: '3.8'

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-os
    # 🛡️ SHIFT-LEFT SECURITY: Map host user credentials dynamically to bypass root permission pollution
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount the configuration and memory state securely
      - ./System/config:/opt/brain/System/config
      - ./Meta:/opt/brain/Meta
      - ./.env:/opt/brain/.env
      # Dynamic mount point for the target workspace resolved via wrapper scripts
      - ${BRAIN_WORKSPACE_MOUNT:-./Workspace}:/workspace
    network_mode: host # Allows Brain to talk to localhost:11434 (Ollama) seamlessly
    tty: true
    stdin_open: true
