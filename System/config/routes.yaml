routes:
  FAST:
    - agent: "fast_responder"
      tools: ["sense_environment"]
      context: ["Meta", "Domain"]

  WORKSPACE:
    - agent: "archivist"
      tools: ["base", "write", "sense_environment"]
      context: ["Meta", "Domain"]

  CODE_GENERATION:
    - agent: "swarm_architect"
      tools: ["base", "write", "sense_environment"]
      context: ["Meta", "Domain", "Studio", "Professional"]
    - swarm:
        - agent: "frontend_engineer"
          tools: ["base", "write", "execute", "map_spatial_dependencies"]
          context: ["Studio"]
        - agent: "backend_engineer"
          tools: ["base", "write", "execute", "map_spatial_dependencies"]
          context: ["Studio"]
    - agent: "qa_auditor"
      tools: ["base", "execute", "vision"]
      context: ["Meta", "Domain", "Studio", "Professional"]
    - agent: "deployment_ops"
      tools: ["base", "write", "execute"]
      context: ["Meta", "Domain", "Studio", "Professional"]

  # HERMES: Keep this preserved for future communications routing
  #   - agent: "communications_bridge"
  #     tools: ["base", "write", "execute", "sense_environment"]
  #     context: ["Meta", "Studio", "Professional"]

  MEMORY:
    - agent: "archivist"
      tools: ["base", "write", "sense_environment", "map_spatial_dependencies"]
      context: ["Meta", "Domain", "Personal", "Professional", "Studio"]

  SENSE:
    - agent: "archivist"
      tools: ["base", "sense_environment"]
      context: ["Meta"]

  SUBCONSCIOUS_FORAGE:
    - agent: "forager"
      tools: ["base", "write", "sense_environment"]
      context: ["Meta", "Personal", "Professional"]

  SUBCONSCIOUS_DAYDREAM:
    - agent: "daydreamer"
      tools: ["base", "write"]
      context: ["Meta", "Studio", "Personal", "Professional"]

  VISION:
    - agent: "artist"
      tools: ["base", "vision", "write"]
      context: ["Meta", "Domain", "Studio", "Personal", "Professional", "Media"]

  STATIC_PAGE:
    - agent: "frontend_engineer"
      tools: ["base", "execute", "map_spatial_dependencies"]
      context: ["Studio"]
    - agent: "qa_auditor"
      tools: ["base", "execute"]
      context: ["Meta", "Domain", "Studio"]
