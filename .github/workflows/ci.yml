name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE FIX: Removed fragile base/head delta math entirely.
      # TruffleHog will now confidently and rapidly scan the entire repository
      # on every single push, ensuring it never skips or crashes on branch boundaries.
      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug

      # THE FIX: Changed @v2 to @v1. The v2 action tag is currently broken on GitHub's
      # backend (causing the 404 tar.gz error). v1 safely installs deno v2.x.
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Vendor Offline WASM Sandbox
        run: |
          uv run python -c "from System.core.paths import ROOT_DIR; from System.core.onboarding.vendor_sandbox import vendor_offline_sandbox; vendor_offline_sandbox(ROOT_DIR)"

      - name: Run Ruff (Formatting & Linting)
        run: uv run ruff check .

      - name: Run Ruff (Format Check)
        if: success() || failure()
        run: uv run ruff format --check .

      - name: Run Mypy (Type Checking)
        if: success() || failure()
        run: uv run mypy System/ Sense/ --ignore-missing-imports

      - name: Run Pytest with Strict Coverage (Gate Enforcement)
        if: success() || failure()
        run: uv run pytest System/tests Sense/tests --cov -n auto --cov-fail-under=80
