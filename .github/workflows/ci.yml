name: Brain CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for TruffleHog to scan the entire history

      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      # ⚡ FIXED: Inject the Deno runtime into the CI runner so the WebAssembly sandbox can compile
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Vendor Offline WASM Sandbox
        run: |
          uv run python -c "from System.core.paths import ROOT_DIR; from System.core.onboarding.vendor_sandbox import vendor_offline_sandbox; vendor_offline_sandbox(ROOT_DIR)"

      - name: Run Ruff (Formatting & Linting)
        run: uv run ruff check .

      - name: Run Mypy (Type Checking)
        run: uv run mypy System/ Sense/ --ignore-missing-imports

      - name: Run Pytest with Strict Coverage (Gate Enforcement)
        run: uv run pytest System/tests Sense/tests --cov -n 0
