name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use a filesystem scan and exclude the internal .git folder to ignore the temporary GitHub token.
      - name: TruffleHog Secret Scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /tmp
          echo ".*\.git/.*" > .thignore
          /tmp/trufflehog filesystem ./ --exclude-paths .thignore --fail

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install uv
        id: uv_install
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Vendor Offline WASM Sandbox
        run: |
          uv run python -c "from System.core.paths import ROOT_DIR; from System.core.onboarding.vendor_sandbox import vendor_offline_sandbox; vendor_offline_sandbox(ROOT_DIR)"

      - name: Run Ruff (Formatting & Linting)
        run: uv run ruff check .

      # Smart Gates. These will still run if a previous test fails, but will gracefully skip if uv failed to install.
      - name: Run Ruff (Format Check)
        if: (success() || failure()) && steps.uv_install.outcome == 'success'
        run: uv run ruff format --check .

      - name: Run Mypy (Type Checking)
        if: (success() || failure()) && steps.uv_install.outcome == 'success'
        run: uv run mypy System/ Sense/ --ignore-missing-imports

      - name: Run Pytest with Strict Coverage (Gate Enforcement)
        if: (success() || failure()) && steps.uv_install.outcome == 'success'
        run: uv run pytest System/tests Sense/tests --cov -n auto --cov-fail-under=80
