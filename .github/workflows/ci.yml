name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine TruffleHog scope using inline YAML.
      # Scans the PR diff if it is a pull request.
      # Scans the latest commit (HEAD~1 to HEAD) if it is a direct push or a new branch.
      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --debug

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Vendor Offline WASM Sandbox
        run: |
          uv run python -c "from System.core.paths import ROOT_DIR; from System.core.onboarding.vendor_sandbox import vendor_offline_sandbox; vendor_offline_sandbox(ROOT_DIR)"

      - name: Run Ruff (Formatting & Linting)
        run: uv run ruff check .

      - name: Run Ruff (Format Check)
        if: success() || failure()
        run: uv run ruff format --check .

      - name: Run Mypy (Type Checking)
        if: success() || failure()
        run: uv run mypy System/ Sense/ --ignore-missing-imports

      - name: Run Pytest with Strict Coverage (Gate Enforcement)
        if: success() || failure()
        run: uv run pytest System/tests Sense/tests --cov -n auto --cov-fail-under=80
