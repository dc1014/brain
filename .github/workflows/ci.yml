jobs:

  security-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Vendor Offline WASM Sandbox
        run: |
          uv run python -c "from System.core.paths import ROOT_DIR; from System.core.onboarding.vendor_sandbox import vendor_offline_sandbox; vendor_offline_sandbox(ROOT_DIR)"

      - name: Run Ruff (Formatting & Linting)
        run: uv run ruff check .

      - name: Run Mypy (Type Checking)
        run: uv run mypy System/ Sense/ --ignore-missing-imports
        continue-on-error: true

      - name: Run Pytest with Strict Coverage (Gate Enforcement)
        if: always()
        run: uv run pytest System/tests Sense/tests --cov -n 0
